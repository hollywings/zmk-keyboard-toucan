CONFIG_NICE_VIEW_WIDGET_INVERTED=n

# --- Battery reporting ---
# The toucan halves use a voltage-divider battery sensor (zmk,battery-voltage-divider
# on the xiao_ble VBAT ADC pin). The voltage-divider driver computes state_of_charge
# internally and exposes it via SENSOR_CHAN_GAUGE_STATE_OF_CHARGE, so the default
# STATE_OF_CHARGE fetch mode works correctly. CONFIG_ZMK_BATTERY_REPORTING=y ensures
# the peripheral reads the battery and exposes it via the standard Bluetooth Battery
# Service (BAS) GATT characteristic. The central (dongle) then fetches the peripheral
# battery levels via ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING (set in
# Kconfig.defconfig for SHIELD_TOUCAN_DONGLE).
CONFIG_ZMK_BATTERY_REPORTING=y

# --- ZMK Dongle Screen Engine (neon-cat theme) ---
CONFIG_ZMK_DONGLE_SCREEN_BRIGHTNESS=80
CONFIG_ZMK_DONGLE_SCREEN_DONGLE_BATTERY=n

# --- Power management for Prospector dongle ---
CONFIG_ZMK_IDLE_TIMEOUT=300000

# Enable full sleep support
CONFIG_ZMK_SLEEP=y

# After 15 minutes of inactivity, enter deep sleep
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

CONFIG_ZMK_STUDIO_LOCKING=n
