CONFIG_NICE_VIEW_WIDGET_INVERTED=n
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80
# --- Power management for Prospector dongle ---

# Go into "idle" (low power, screen off) after 30 seconds of no activity
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Enable full sleep support
CONFIG_ZMK_SLEEP=y

# After 15 minutes of inactivity, enter deep sleep
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000

# Make sure display exists and blanks when idle
# CONFIG_ZMK_DISPLAY=y
# CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
