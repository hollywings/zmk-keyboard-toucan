CONFIG_NICE_VIEW_WIDGET_INVERTED=n

# --- Battery reporting ---
# The toucan halves use a voltage-divider battery sensor (zmk,battery-voltage-divider
# on the xiao_ble VBAT ADC pin), not a fuel gauge. ZMK main defaults to the
# STATE_OF_CHARGE fetch mode (SENSOR_CHAN_GAUGE_STATE_OF_CHARGE), which the
# voltage-divider driver does not support, so the read fails and the reported
# level stays 0 -> both dongle-screen batteries render empty. Use the
# LITHIUM_VOLTAGE mode, which reads SENSOR_CHAN_VOLTAGE and converts via the
# lithium-ion discharge curve. Required on the peripheral halves so they forward
# a real state_of_charge to the central via the split transport.
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_LITHIUM_VOLTAGE=y

# --- ZMK Dongle Screen Engine (neon-cat theme) ---
CONFIG_ZMK_DONGLE_SCREEN_BRIGHTNESS=80
CONFIG_ZMK_DONGLE_SCREEN_DONGLE_BATTERY=n

# --- Power management for Prospector dongle ---
CONFIG_ZMK_IDLE_TIMEOUT=300000

# Enable full sleep support
CONFIG_ZMK_SLEEP=y

# After 15 minutes of inactivity, enter deep sleep
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

CONFIG_ZMK_STUDIO_LOCKING=n
